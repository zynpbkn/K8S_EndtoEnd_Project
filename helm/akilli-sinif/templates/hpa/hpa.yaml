# ─── Quiz Service HPA ──────────────────────────────────────────────
# Quiz üretimi CPU yoğun (LLM çağrısı yapıyor).
# CPU %70 geçince yeni pod açılır, max 6 pod'a kadar çıkar.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quiz-service-hpa
  namespace: {{ include "akilli-sinif.namespace" . }}
  labels:
    {{- include "akilli-sinif.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quiz-service
  minReplicas: {{ .Values.hpa.quizService.minReplicas }}
  maxReplicas: {{ .Values.hpa.quizService.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.quizService.cpuUtilization }}
---
# ─── Embedding Service HPA ─────────────────────────────────────────
# PDF işleme ve embedding üretimi yoğun işlem.
# CPU %70 geçince yeni pod açılır, max 4 pod.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: embedding-service-hpa
  namespace: {{ include "akilli-sinif.namespace" . }}
  labels:
    {{- include "akilli-sinif.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: embedding-service
  minReplicas: {{ .Values.hpa.embeddingService.minReplicas }}
  maxReplicas: {{ .Values.hpa.embeddingService.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.embeddingService.cpuUtilization }}

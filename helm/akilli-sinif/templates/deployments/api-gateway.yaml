apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ include "akilli-sinif.namespace" . }}
  labels:
    {{- include "akilli-sinif.labels" . | nindent 4 }}
    app: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false
      # ─── Init Container ──────────────────────────────────────────
      # quiz-service ve embedding-service hazır olana kadar bekler
      initContainers:
        - name: wait-for-quiz-service
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z quiz-service.akilli-sinif 8000; do echo 'quiz-service bekleniyor...'; sleep 3; done"]
        - name: wait-for-embedding-service
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z embedding-service.akilli-sinif 8002; do echo 'embedding-service bekleniyor...'; sleep 3; done"]
        - name: wait-for-progress-service
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z progress-service.akilli-sinif 8003; do echo 'progress-service bekleniyor...'; sleep 3; done"]
      # ─────────────────────────────────────────────────────────────
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: akilli-sinif-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: akilli-sinif-secret
                  key: GEMINI_API_KEY
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ include "akilli-sinif.namespace" . }}
  labels:
    {{- include "akilli-sinif.labels" . | nindent 4 }}
spec:
  type: {{ .Values.apiGateway.service.type }}
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: 8000
      nodePort: {{ .Values.apiGateway.service.nodePort }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-service
  namespace: {{ include "akilli-sinif.namespace" . }}
  labels:
    {{- include "akilli-sinif.labels" . | nindent 4 }}
    app: quiz-service
spec:
  replicas: {{ .Values.quizService.replicaCount }}
  selector:
    matchLabels:
      app: quiz-service
  template:
    metadata:
      labels:
        app: quiz-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      # ─── Init Containers ─────────────────────────────────────────
      # PostgreSQL ve ChromaDB hazır olmadan quiz servisi başlamaz
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ .Values.config.postgresHost }} 5432; do echo 'PostgreSQL bekleniyor...'; sleep 3; done; echo 'PostgreSQL hazır!'"]
        - name: wait-for-chromadb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z chromadb 8000; do echo 'ChromaDB bekleniyor...'; sleep 3; done; echo 'ChromaDB hazır!'"]
      # ─────────────────────────────────────────────────────────────
      containers:
        - name: quiz-service
          image: "{{ .Values.quizService.image.repository }}:{{ .Values.quizService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: akilli-sinif-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: akilli-sinif-secret
                  key: GEMINI_API_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: akilli-sinif-secret
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.quizService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-service
  namespace: {{ include "akilli-sinif.namespace" . }}
  labels:
    {{- include "akilli-sinif.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: quiz-service
  ports:
    - port: {{ .Values.quizService.service.port }}
      targetPort: 8000

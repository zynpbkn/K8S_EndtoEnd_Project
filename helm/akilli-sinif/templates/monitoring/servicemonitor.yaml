# ServiceMonitor: kube-prometheus-stack'e
# "bu namespace'deki /metrics endpoint'lerini tara" der.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: akilli-sinif-monitor
  namespace: {{ include "akilli-sinif.namespace" . }}
  labels:
    {{- include "akilli-sinif.labels" . | nindent 4 }}
    # kube-prometheus-stack bu label'ı arar
    release: akilli-sinif
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - {{ include "akilli-sinif.namespace" . }}

apiVersion: v2
name: akilli-sinif
description: Kişiselleştirilmiş Öğrenme Asistanı — Kubernetes Bootcamp Bitirme Projesi
type: application
version: 1.0.0
appVersion: "1.0.0"
maintainers:
  - name: bootcamp-ogrenci

# ─── Helm Dependency'leri ──────────────────────────────────────────
# "helm dependency update" komutu bunları charts/ klasörüne indirir.
# Sonra tek "helm install" ile hepsi kurulur.
dependencies:
  # PostgreSQL — Bitnami
  - name: postgresql
    version: "15.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  # Prometheus + Grafana + AlertManager — hepsi tek chart
  - name: kube-prometheus-stack
    version: "58.x.x"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.enabled
